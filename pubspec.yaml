name: phobes
description: Phobes - Zaman Yönetimi ve Verimlilik Uygulaması
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' 

dependencies:
  flutter:
    sdk: flutter
 
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^14.0.0
  rxdart: ^0.27.7

  cupertino_icons: ^1.0.2
  intl: ^0.19.0             
  google_fonts: ^6.2.1    
  table_calendar: ^3.1.2    
  animate_do: ^3.3.4        
  flutter_quill: ^9.3.15   
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.2
  flutter_heatmap_calendar: ^1.0.5
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  cloud_functions: ^5.0.0
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.2

  http: ^1.6.0
  speech_to_text: ^7.3.0
  percent_indicator: ^4.2.5
  confetti: ^0.8.0
  flutter_local_notifications: ^17.0.0 
  timezone: ^0.9.2                      
  cached_network_image: ^3.4.1
  firebase_app_check: ^0.3.2+10
  firebase_crashlytics: ^4.0.0
  device_calendar: ^4.3.0
  share_plus: ^12.0.1
  pdf: ^3.11.3
  excel: ^4.0.6
  file_saver: ^0.2.14
  home_widget: ^0.9.0
  flutter_timezone: ^5.0.1
  geolocator: ^14.0.2
  app_links: 6.2.0
  flutter_tts: ^4.2.5
  permission_handler: ^12.0.1
  sign_in_with_apple: ^7.0.1
  firebase_messaging: ^15.0.0
  package_info_plus: ^8.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  firebase_core_platform_interface: ^6.0.3

dependency_overrides:
  intl: 0.20.2

flutter:
  generate: true
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - assets/icon/icon.png
    - assets/fonts/Outfit-Regular.ttf
    - assets/fonts/Outfit-Bold.ttf

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Thin.ttf
          weight: 100
        - asset: assets/fonts/Outfit-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Outfit-Black.ttf
          weight: 900
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon" 
  ios: true                 
  image_path: "assets/icon/icon.png" 
  adaptive_icon_background: "#E5D9FF"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    icon_size: 256
    image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"

flutter_native_splash:
  color: "#0A0A0A"
  android: true
  ios: true
  web: true
  android_12:
    color: "#0A0A0A"
      
