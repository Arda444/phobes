workflows:

  # ── Tests (analyze + Flutter + Firestore rules) ───────────────────────────
  test-workflow:
    name: Phobes Tests
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
      node: latest
      java: 21
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze
      - name: Flutter unit & widget tests
        script: flutter test
      - name: Firestore rules tests
        script: |
          cd rules_test
          npm ci
          npm test

  # ── iOS (side-loading, no Apple account needed) ───────────────────────────
  ios-workflow:
    name: Phobes iOS (No-codesign IPA)
    max_build_duration: 90
    instance_type: mac_mini_m1
    environment:
      # Pin below Flutter 3.44 — flutter_quill 9.x breaks on TextInputClient.onFocusReceived.
      flutter: 3.29.3
      xcode: 16.4
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager
        script: flutter config --no-enable-swift-package-manager
      - name: Flutter packages
        script: flutter pub get
      - name: CocoaPods
        script: cd ios && pod install
      - name: Build unsigned IPA
        script: |
          set -e
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=-

          echo "Building debug IPA for sideloading (no Apple Developer account)..."
          set +e
          flutter build ios --debug --no-codesign
          BUILD_STATUS=$?
          set -e

          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ $BUILD_STATUS -ne 0 ] || [ ! -d "$APP_PATH" ]; then
            echo "Flutter debug build failed or app missing; trying xcodebuild directly..."
            flutter build ios --config-only --debug --no-codesign
            cd ios
            xcodebuild \
              -workspace Runner.xcworkspace \
              -scheme Runner \
              -configuration Debug \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$CM_BUILD_DIR/build/ios_derived" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=- \
              DEVELOPMENT_TEAM= \
              PROVISIONING_PROFILE_SPECIFIER= \
              build
            cd "$CM_BUILD_DIR"
            APP_PATH="$(find build/ios_derived -path '*/Build/Products/Debug-iphoneos/Runner.app' -type d | head -1)"
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found after iOS build"
            find build -maxdepth 6 -type d 2>/dev/null || true
            exit 1
          fi

          echo "Packaging $APP_PATH"
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP_PATH" build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          rm -f phobes.ipa
          zip -r phobes.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - ardakocaoglu44@gmail.com
        notify:
          success: true
          failure: true

  # ── Android (signed APK + AAB for Play Store) ─────────────────────────────
  # Required Codemagic environment variables (Settings → Environment variables):
  #   CM_KEYSTORE          – base64-encoded .jks file   (Binary, Protected)
  #   CM_KEYSTORE_PASSWORD – keystore password           (Protected)
  #   CM_KEY_ALIAS         – key alias                   (e.g. phobes-key)
  #   CM_KEY_PASSWORD      – key password                (Protected)
  android-workflow:
    name: Phobes Android (APK + AAB)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 21
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Restore keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=release.jks
          EOF
      - name: Flutter analyze
        script: flutter analyze
      - name: Flutter tests
        script: flutter test
      - name: Build APK
        script: flutter build apk --release
      - name: Build AAB (Play Store)
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
    publishing:
      email:
        recipients:
          - ardakocaoglu44@gmail.com
        notify:
          success: true
          failure: true

  # ── Web (Firebase Hosting deploy) ─────────────────────────────────────────
  # Required Codemagic environment variables:
  #   FIREBASE_TOKEN – get with: firebase login:ci   (Protected)
  web-workflow:
    name: Phobes Web (Firebase Hosting)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze
      - name: Flutter tests
        script: flutter test
      - name: Build web
        # RECAPTCHA_SITE_KEY must be set in Codemagic environment variables (Protected).
        script: |
          dart run tool/generate_icon_manifest.dart
          flutter build web --release --no-wasm-dry-run --dart-define=RECAPTCHA_SITE_KEY="$RECAPTCHA_SITE_KEY"
      - name: Install Firebase CLI
        script: npm install -g firebase-tools
      - name: Build Cloud Functions
        script: |
          cd functions
          npm ci
          npm run build
          cd ..
      - name: Deploy Firebase (hosting, rules, indexes, functions)
        script: |
          firebase deploy --only hosting,firestore:rules,firestore:indexes,functions --token "$FIREBASE_TOKEN" --non-interactive
    artifacts:
      - build/web/**
    publishing:
      email:
        recipients:
          - ardakocaoglu44@gmail.com
        notify:
          success: true
          failure: true
